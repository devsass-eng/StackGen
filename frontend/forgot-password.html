<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/stackgen.svg" type="image/svg+xml">
  <title>Forgot Password - StackGen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="card auth-card">
      <h2 class="text-center mb-1">Reset your password</h2>
      <p class="auth-page-description">Enter the email address associated with your StackGen account. We’ll send you a secure reset link.</p>
      <form id="forgot-password-form">
        <div class="form-group">
          <label for="recovery-email">Email</label>
          <input type="email" id="recovery-email" class="form-control" autocomplete="email" required>
        </div>
        <button type="submit" class="btn btn-primary auth-submit">Send reset link</button>
      </form>
      <p id="forgot-password-status" class="auth-feedback" role="status" aria-live="polite"></p>
      <p class="text-center mt-1"><small><a href="login.html">Back to login</a></small></p>
    </div>
  </div>
  <script src="js/pwa.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

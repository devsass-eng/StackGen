<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/stackgen.svg" type="image/svg+xml">
  <title>Choose a New Password - StackGen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="card auth-card">
      <h2 class="text-center mb-1">Choose a new password</h2>
      <p class="auth-page-description">Choose a password with at least 8 characters.</p>
      <form id="reset-password-form">
        <div class="form-group">
          <label for="new-password">New password</label>
          <input type="password" id="new-password" class="form-control" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="form-group">
          <label for="confirm-new-password">Confirm new password</label>
          <input type="password" id="confirm-new-password" class="form-control" autocomplete="new-password" minlength="8" required>
        </div>
        <button type="submit" class="btn btn-primary auth-submit">Save new password</button>
      </form>
      <p id="reset-password-status" class="auth-feedback" role="status" aria-live="polite"></p>
      <p class="text-center mt-1"><small><a href="login.html">Back to login</a></small></p>
    </div>
  </div>
  <script src="js/pwa.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - StackGen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .profile-wrapper {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 2rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    .avatar-card {
      text-align: center;
    }

    .avatar-upload-wrapper {
      position: relative;
      display: inline-block;
      cursor: pointer;
      margin-bottom: 1.5rem;
    }

    .avatar-upload-wrapper:hover .avatar-overlay {
      opacity: 1;
    }

    .avatar-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.5);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
      font-size: 0.8rem;
      color: #fff;
    }

    .avatar-large {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--accent-primary);
      display: block;
    }

    .profile-name-display {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .profile-email-display {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .member-since {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-color);
    }

    .settings-card h3 {
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
      color: var(--accent-primary);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .save-btn-wrapper {
      display: flex;
      justify-content: flex-end;
      margin-top: 1.5rem;
      gap: 1rem;
      align-items: center;
    }

    .success-msg {
      color: var(--success);
      font-size: 0.9rem;
      display: none;
    }

    .upload-input-hidden {
      display: none;
    }

    @media (max-width: 768px) {
      .profile-wrapper {
        grid-template-columns: 1fr;
      }

      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h2>StackGen</h2>
      <p>Learn • Build • Track • Grow</p>
    </div>
    <ul class="nav-links">
      <li><a href="index.html">🏠 Dashboard</a></li>
      <li><a href="roadmap.html">🗺️ Roadmap</a></li>
      <li><a href="lessons.html">📚 Lessons</a></li>
      <li><a href="progress.html">📊 Progress</a></li>
      <li><a href="projects.html">💻 Projects</a></li>
      <li><a href="notes.html">📝 Notes</a></li>
      <li><a href="profile.html" class="active">👤 Profile</a></li>
      <li><a href="#" id="logout-btn">🚪 Logout</a></li>
    </ul>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="header">
      <div class="mobile-toggle" id="mobile-toggle">☰</div>
      <h1>Profile & Settings</h1>
      <div class="user-info" id="header-user-info"></div>
    </header>

    <div class="profile-wrapper">

      <!-- Avatar Card -->
      <div>
        <div class="card avatar-card">
          <label for="avatar-file-input" class="avatar-upload-wrapper">
            <img id="profile-picture-preview" src="https://ui-avatars.com/api/?name=User&background=3b82f6&color=fff&size=130" alt="Profile Picture" class="avatar-large">
            <div class="avatar-overlay">📷 Change Photo</div>
          </label>
          <input type="file" id="avatar-file-input" class="upload-input-hidden" accept="image/*">

          <div class="profile-name-display" id="profile-name-display">Loading...</div>
          <div class="profile-email-display" id="profile-email-display">—</div>
          <div class="member-since" id="member-since">Member since: —</div>
        </div>
      </div>

      <!-- Settings Card -->
      <div class="settings-card">
        <div class="card">
          <h3>👤 Personal Information</h3>
          <form id="profile-form">
            <div class="form-row">
              <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="profile-name" class="form-control" placeholder="Your name">
              </div>
              <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="profile-email" class="form-control" placeholder="your@email.com">
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="profile-phone" class="form-control" placeholder="+1 234 567 8900">
              </div>
              <div class="form-group">
                <label>Location / Address</label>
                <input type="text" id="profile-address" class="form-control" placeholder="City, Country">
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" id="profile-dob" class="form-control">
              </div>
              <div class="form-group">
                <!-- Spacer -->
              </div>
            </div>

            <div class="form-group">
              <label>Bio / About Me</label>
              <textarea id="profile-bio" class="form-control" rows="4" placeholder="Tell us a little about yourself and your learning goals..."></textarea>
            </div>

            <div class="save-btn-wrapper">
              <span class="success-msg" id="success-msg">✅ Profile updated successfully!</span>
              <button type="submit" class="btn btn-primary" id="save-btn">Save Changes</button>
            </div>
          </form>
        </div>

        <div class="card mt-1">
          <h3>🔒 Security</h3>
          <form id="password-form">
            <div class="form-group">
              <label for="current-password">Current password</label>
              <input type="password" id="current-password" class="form-control" autocomplete="current-password" required>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="new-password">New password</label>
                <input type="password" id="new-password" class="form-control" autocomplete="new-password" minlength="8" required>
              </div>
              <div class="form-group">
                <label for="confirm-password">Confirm new password</label>
                <input type="password" id="confirm-password" class="form-control" autocomplete="new-password" minlength="8" required>
              </div>
            </div>
            <div class="save-btn-wrapper">
              <span id="password-message" role="status" aria-live="polite"></span>
              <button type="submit" class="btn btn-primary" id="change-password-btn">Change Password</button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/stackgen.svg" type="image/svg+xml">
  <title>Notes - StackGen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h2>StackGen</h2>
      <p>Learn • Build • Track • Grow</p>
    </div>
    <ul class="nav-links">
      <li><a href="index.html">🏠 Dashboard</a></li>
      <li><a href="roadmap.html">🗺️ Roadmap</a></li>
      <li><a href="lessons.html">📚 Lessons</a></li>
      <li><a href="progress.html">📊 Progress</a></li>
      <li><a href="projects.html">💻 Projects</a></li>
      <li><a href="notes.html" class="active">📝 Notes</a></li>
      <li><a href="profile.html">👤 Profile</a></li>
      <li><a href="#" id="logout-btn">🚪 Logout</a></li>
    </ul>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="header">
      <div class="mobile-toggle" id="mobile-toggle">☰</div>
      <h1>Notes</h1>
      <div style="display: flex; align-items: center; gap: 1rem;">
        <button class="btn btn-primary" id="add-note-btn">Add Note</button>
        <div class="user-info" id="header-user-info">
          <!-- Injected via app.js -->
        </div>
      </div>
    </header>
    
    <div class="form-group mb-2">
        <input type="text" id="search-notes" class="form-control" placeholder="Search notes...">
    </div>

    <div class="grid-2" id="notes-container">
      <!-- Notes populated via JS -->
      <p>Loading notes...</p>
    </div>
  </main>

  <!-- Note Modal -->
  <div id="note-modal" class="modal">
    <div class="modal-content">
      <span class="close-modal" id="close-note-modal">&times;</span>
      <h2 id="modal-title" class="mb-1">Add Note</h2>
      <form id="note-form">
        <input type="hidden" id="note-id">
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="note-title" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Content</label>
          <textarea id="note-content" class="form-control" rows="6" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary mt-1">Save Note</button>
      </form>
    </div>
  </div>

  <script src="js/pwa.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notes.js"></script>
</body>
</html>
